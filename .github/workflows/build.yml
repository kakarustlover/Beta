name: Build Velora APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK + NDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" 2>&1 | tail -3
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build .so with cargo-ndk
        run: cargo ndk -t arm64-v8a -o jniLibs build --release

      - name: Build APK manually
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/33.0.2
          AJAR=$ANDROID_HOME/platforms/android-33/android.jar

          # ساختار APK
          mkdir -p build-apk/res/values
          mkdir -p build-apk/lib/arm64-v8a
          cp jniLibs/arm64-v8a/libvelora.so build-apk/lib/arm64-v8a/

          # strings.xml
          cat > build-apk/res/values/strings.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Velora</string>
          </resources>
          XMLEOF

          # AndroidManifest.xml
          cat > build-apk/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.velora.player">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="33"/>
              <application android:label="@string/app_name" android:hasCode="false">
                  <activity
                      android:name="android.app.NativeActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="velora"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF

          # کامپایل و لینک
          cd build-apk
          $BT/aapt2 compile --dir res -o res.zip
          $BT/aapt2 link -o base.apk -I $AJAR --manifest AndroidManifest.xml res.zip

          # اضافه کردن .so به APK
          zip -r base.apk lib

          cd ..

          # ساخت keystore
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt 2>&1 | tail -1

          # Align + Sign
          $BT/zipalign -f 4 build-apk/base.apk build-apk/aligned.apk
          $BT/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out velora.apk \
            build-apk/aligned.apk

          $BT/apksigner verify --verbose velora.apk
          echo "---"
          ls -la velora.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velora-apk
          path: velora.apk
          if-no-files-found: error

name: Build Velora APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # مرحله ۱: دریافت کد
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # مرحله ۲: نصب Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # مرحله ۳: نصب Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # مرحله ۴: نصب NDK (با Fallback)
      # ==========================================
      - name: Install NDK 25.2.9519653
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" || {
            echo "⚠️ NDK 25.2.9519653 failed, trying 25.2.9519653 with different approach..."
            sdkmanager --install "ndk;25.2.9519653"
          }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ==========================================
      # مرحله ۵: بررسی NDK
      # ==========================================
      - name: Verify NDK
        run: |
          echo "ANDROID_NDK_HOME = $ANDROID_NDK_HOME"
          echo "NDK_HOME = $NDK_HOME"
          ls -la "$ANDROID_NDK_HOME" | head -10 || echo "⚠️ NDK directory not found"

      # ==========================================
      # مرحله ۶: نصب Rust و target اندروید
      # ==========================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # ==========================================
      # مرحله ۷: کش Cargo
      # ==========================================
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ==========================================
      # لایه ۱: نصب cargo-apk نسخه 0.9.6 (پایدار)
      # ==========================================
      - name: Install cargo-apk (v0.9.6 - Stable)
        id: install-cargo-apk
        run: |
          cargo install cargo-apk --version 0.9.6 --locked || {
            echo "⚠️ cargo-apk 0.9.6 failed, trying latest..."
            cargo install cargo-apk || exit 1
          }
        continue-on-error: true

      # ==========================================
      # بیلد با cargo-apk
      # ==========================================
      - name: Build APK with cargo-apk
        id: build-cargo-apk
        if: steps.install-cargo-apk.outcome == 'success'
        run: |
          cargo apk build --release || {
            echo "⚠️ cargo-apk build failed, will try fallback..."
            exit 1
          }
        continue-on-error: true

      # ==========================================
      # لایه ۲: Fallback به xbuild
      # ==========================================
      - name: Fallback - Install and Build with xbuild
        id: build-xbuild
        if: steps.build-cargo-apk.outcome == 'failure' || steps.install-cargo-apk.outcome == 'failure'
        run: |
          echo "⚠️ cargo-apk failed. Trying xbuild as fallback..."
          cargo install xbuild || exit 1
          xbuild build --release --platform android || {
            echo "⚠️ xbuild failed, will try cargo-ndk..."
            exit 1
          }
        continue-on-error: true

      # ==========================================
      # لایه ۳: Fallback نهایی به cargo-ndk
      # ==========================================
      - name: Fallback - Install and Build with cargo-ndk
        id: build-cargo-ndk
        if: steps.build-xbuild.outcome == 'failure'
        run: |
          echo "⚠️ xbuild failed. Trying cargo-ndk as final fallback..."
          cargo install cargo-ndk || exit 1
          cargo ndk -t aarch64-linux-android build --release || {
            echo "❌ All build methods failed!"
            exit 1
          }
        continue-on-error: true

      # ==========================================
      # Debug: نمایش تمام خروجی‌های بیلد
      # ==========================================
      - name: Debug - Find all build outputs
        if: always()
        run: |
          echo "=== All .apk files ==="
          find / -name "*.apk" -type f 2>/dev/null || echo "NO APK FOUND ANYWHERE"
          echo ""
          echo "=== All .so files ==="
          find target -name "*.so" -type f 2>/dev/null || echo "NO .so FOUND"
          echo ""
          echo "=== target tree ==="
          find target -maxdepth 4 -type d 2>/dev/null | head -40
          echo ""
          echo "=== ANDROID_NDK_HOME ==="
          echo "$ANDROID_NDK_HOME"
          echo ""
          echo "=== cargo-apk build result ==="
          echo "cargo-apk: ${{ steps.build-cargo-apk.outcome }}"
          echo "xbuild: ${{ steps.build-xbuild.outcome }}"
          echo "cargo-ndk: ${{ steps.build-cargo-ndk.outcome }}"

      # ==========================================
      # آپلود همه خروجی‌ها (APK + .so)
      # ==========================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-output
          path: |
            target/**/*.apk
            target/**/*.so
          if-no-files-found: warn
